<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHUTTLE_X Admin Chat Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        :root {
            --bg: #040E1F; --surface: #0B1A2F; --primary: #CAFD00; --text: #E8EEF9; --secondary: #93A4BE;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 300px; background: var(--surface); border-right: 1px solid #15263F; display: flex; flex-direction: column; }
        #chat-area { flex: 1; display: flex; flex-direction: column; }
        .header { padding: 20px; border-bottom: 1px solid #15263F; }
        .room-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #15263F; transition: 0.2s; }
        .room-item:hover { background: #15263F; }
        .room-item.active { border-left: 4px solid var(--primary); background: #15263F; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 70%; padding: 10px 15px; border-radius: 15px; font-size: 14px; position: relative; }
        .msg.admin { align-self: flex-end; background: var(--primary); color: #000; border-bottom-right-radius: 2px; }
        .msg.user { align-self: flex-start; background: #15263F; color: #fff; border-bottom-left-radius: 2px; }
        .input-group { padding: 20px; background: var(--surface); display: flex; gap: 10px; }
        input, button { padding: 10px; border-radius: 8px; border: 1px solid #15263F; background: #040E1F; color: #fff; }
        button { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border: none; }
        button:disabled { opacity: 0.5; }
        .status { font-size: 12px; margin-top: 5px; color: var(--secondary); }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="header">
            <h3>Admin Inbox</h3>
            <input type="text" id="token" placeholder="Admin Bearer Token" style="width: 100%; margin-bottom: 10px;">
            <button onclick="loadInbox()" style="width: 100%;">Refresh Inbox</button>
            <div id="conn-status" class="status">Disconnected</div>
        </div>
        <div id="room-list" style="overflow-y: auto;"></div>
    </div>
    <div id="chat-area">
        <div id="messages">Select a room to start chatting</div>
        <div class="input-group">
            <input type="text" id="msg-input" placeholder="Type a message..." style="flex: 1;" onkeypress="if(event.key==='Enter') sendMsg()">
            <button id="send-btn" onclick="sendMsg()" disabled>Send</button>
        </div>
    </div>

    <script>
        let currentRoomId = null;
        let stompClient = null;
        let subscriptions = {};
        const BASE_URL = "http://35.174.95.187:80"; // Adjust if your backend IP changes

        async function loadInbox() {
            const token = document.getElementById('token').value;
            if (!token) return alert("Please enter Admin Token");
            
            try {
                const res = await fetch(`${BASE_URL}/api/chat/admin/inbox`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const rooms = data.data.content || data.data.items || [];
                
                const list = document.getElementById('room-list');
                list.innerHTML = rooms.map(r => `
                    <div class="room-item ${currentRoomId === r.id ? 'active' : ''}" onclick="selectRoom('${r.id}')">
                        <b>Room: ${r.id.substring(0,8)}...</b><br>
                        <small>Unread: ${r.unreadCount || 0}</small>
                    </div>
                `).join('');
                
                connectWebSocket(token);
            } catch (e) { console.error(e); alert("Failed to load inbox"); }
        }

        async function selectRoom(roomId) {
            currentRoomId = roomId;
            document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = "Loading history...";
            document.getElementById('send-btn').disabled = false;

            const token = document.getElementById('token').value;
            try {
                const res = await fetch(`${BASE_URL}/api/chat/rooms/${roomId}/messages?size=50`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const msgs = (data.data.content || data.data.items || []).reverse();
                
                messagesDiv.innerHTML = '';
                msgs.forEach(m => appendMessage(m));
                subscribeToRoom(roomId);
            } catch (e) { console.error(e); }
        }

        function connectWebSocket(token) {
            if (stompClient && stompClient.active) return;

            stompClient = new StompJs.Client({
                brokerURL: `${BASE_URL.replace('http', 'ws')}/ws-chat/websocket`,
                connectHeaders: { 'Authorization': `Bearer ${token}` },
                onConnect: () => {
                    document.getElementById('conn-status').innerText = "Connected";
                    document.getElementById('conn-status').style.color = "var(--primary)";
                },
                onDisconnect: () => {
                    document.getElementById('conn-status').innerText = "Disconnected";
                    document.getElementById('conn-status').style.color = "red";
                }
            });
            stompClient.activate();
        }

        function subscribeToRoom(roomId) {
            if (subscriptions[roomId]) return;
            subscriptions[roomId] = stompClient.subscribe(`/topic/chat.room.${roomId}`, (frame) => {
                const msg = JSON.parse(frame.body);
                if (currentRoomId === roomId) appendMessage(msg);
            });
        }

        function appendMessage(m) {
            const div = document.createElement('div');
            const isMe = m.senderRole === 'ADMIN' || m.senderRole === 'SHOP';
            div.className = `msg ${isMe ? 'admin' : 'user'}`;
            
            if (m.messageType === 'IMAGE' && m.fileUrl) {
                const img = document.createElement('img');
                img.src = m.fileUrl;
                img.style.maxWidth = '250px';
                img.style.borderRadius = '10px';
                img.style.display = 'block';
                img.style.marginBottom = '5px';
                div.appendChild(img);
                if (m.content && m.content !== 'Sent an image') {
                    const txt = document.createElement('span');
                    txt.innerText = m.content;
                    div.appendChild(txt);
                }
            } else {
                div.innerText = m.content;
            }

            const messagesDiv = document.getElementById('messages');
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentRoomId) return;

            stompClient.publish({
                destination: '/app/chat.send',
                body: JSON.stringify({
                    roomId: currentRoomId,
                    messageType: 'TEXT',
                    content: text
                })
            });
            input.value = '';
        }
    </script>
</body>
</html>
